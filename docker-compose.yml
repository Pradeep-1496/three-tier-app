services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: workflow-management
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
      - DB_DATABASE=workflow_management
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - workflow-network

  postgres:
    image: postgres:17-alpine
    container_name: workflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: workflow_management
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d workflow_management']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - workflow-network

  client:
    image: workflow-frontend:latest
    container_name: workflow_management_client
    ports:
      - '4200:4200'
    networks:
      - workflow-network

networks:
  workflow-network:
    driver: bridge

volumes:
  postgres_data:
